[project]
name = "reporeaper"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.40,<2.1", "asyncpg>=0.30,<1", "alembic>=1.15,<2",
  "psycopg[binary,pool]>=3.2,<4", "pydantic-settings>=2.8,<3",
  "celery[redis]>=5.5,<6", "httpx>=0.28,<1",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
  "qdrant-client>=1.14,<2", "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24", "tree-sitter-go>=0.25,<0.26",
  "tree-sitter-java>=0.23,<0.24",
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/reporeaper", "apps/runner/src/reporeaper_runner"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["gate: requires real Compose PostgreSQL Redis Qdrant workers and runner"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
